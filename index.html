<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brace 1.0">
<meta name="theme-color" content="#05070d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Brace 1.0</title>
<style>
  :root { --u:min(1.25vw, 2vh); --eye:#FFD60A; --glow:rgba(255,214,10,.55); --bg:#05070d; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { height:100%; background:var(--bg); overflow:hidden; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; touch-action:manipulation; }

  /* ---------- Face ---------- */
  #face { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(7 * var(--u)); }
  #eyes { display:flex; gap:calc(20 * var(--u)); }
  .eye { position:relative; width:calc(26 * var(--u)); height:calc(30 * var(--u)); background:var(--eye); border-radius:50%;
    box-shadow:0 0 calc(7 * var(--u)) var(--glow); overflow:hidden; transition:transform .25s ease; }
  .pupil { position:absolute; width:calc(11 * var(--u)); height:calc(11 * var(--u)); background:#111; border-radius:50%;
    left:50%; top:50%; transform:translate(-50%,-50%); transition:transform .3s ease-out, width .25s, height .25s; }
  .pupil::after { content:''; position:absolute; width:calc(3.5 * var(--u)); height:calc(3.5 * var(--u)); background:#fff; border-radius:50%; top:calc(1.8 * var(--u)); left:calc(2 * var(--u)); }
  .lid { position:absolute; left:-15%; width:130%; height:100%; background:var(--bg); transition:transform .3s ease; }
  .lid.top { top:-100%; }
  .lid.bottom { top:100%; border-radius:50% 50% 0 0 / 35% 35% 0 0; }

  /* Moods */
  [data-mood="happy"]   .lid.bottom { transform:translateY(-40%); }
  [data-mood="excited"] .lid.bottom { transform:translateY(-45%); }
  [data-mood="excited"] #eyes { animation:bounce .45s ease-in-out 3; }
  [data-mood="surprised"] .eye { transform:scale(1.15); }
  [data-mood="surprised"] .pupil { width:calc(8 * var(--u)); height:calc(8 * var(--u)); }
  [data-mood="thinking"] .lid.top { transform:translateY(18%); }
  [data-mood="sleepy"]  .lid.top { transform:translateY(62%); }
  [data-mood="sad"] .eye.left  .lid.top { transform:translateY(30%) rotate(-14deg); }
  [data-mood="sad"] .eye.right .lid.top { transform:translateY(30%) rotate(14deg); }
  #face.blink .lid.top { transform:translateY(100%) !important; transition:transform .08s; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-calc(4 * var(--u)))} }

  /* Asleep: dimmer glow, gentle breathing */
  #face.asleep .eye, #face.asleep #mouth { box-shadow:0 0 calc(3 * var(--u)) rgba(255,214,10,.25); }
  #face.asleep #eyes { animation:breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50%{ transform:translateY(calc(1.2 * var(--u))); } }
  #zzz { position:absolute; top:calc(6 * var(--u)); right:calc(5 * var(--u)); font-size:calc(7 * var(--u)); font-weight:700; color:var(--eye); opacity:0; pointer-events:none; }
  #face.asleep ~ #zzz { animation:zzz 3s ease-in-out infinite; }
  @keyframes zzz { 0%{opacity:0; transform:translate(0,calc(2 * var(--u)))} 40%{opacity:.8} 100%{opacity:0; transform:translate(calc(3 * var(--u)),-calc(4 * var(--u)))} }

  /* Mouth */
  #mouth { width:calc(26 * var(--u)); height:calc(5 * var(--u)); background:var(--eye); box-shadow:0 0 calc(4 * var(--u)) var(--glow);
    border-radius:0 0 calc(10 * var(--u)) calc(10 * var(--u)); transition:height .1s, width .2s, border-radius .2s; }
  [data-mood="sad"] #mouth { border-radius:calc(10 * var(--u)) calc(10 * var(--u)) 0 0; height:calc(4 * var(--u)); }
  [data-mood="surprised"] #mouth { width:calc(7 * var(--u)); height:calc(7 * var(--u)); border-radius:50%; }
  [data-mood="thinking"] #mouth { width:calc(12 * var(--u)); height:calc(2 * var(--u)); border-radius:calc(2 * var(--u)); }
  [data-mood="sleepy"] #mouth { width:calc(10 * var(--u)); height:calc(2 * var(--u)); border-radius:calc(2 * var(--u)); }
  #mouth.talking { border-radius:calc(4 * var(--u)) calc(4 * var(--u)) calc(10 * var(--u)) calc(10 * var(--u)); width:calc(24 * var(--u)); }

  /* Listening: his eyes glow brighter and pulse gently (no extra dot) */
  #face.listening .eye { animation:listen 1.4s ease-in-out infinite; }
  @keyframes listen { 50%{ box-shadow:0 0 calc(14 * var(--u)) calc(2 * var(--u)) var(--glow); } }

  /* Settings */
  #gear { position:absolute; top:calc(8px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right));
    background:none; border:none; font-size:18px; opacity:.18; color:#fff; padding:8px; z-index:5; }
  .overlay { position:absolute; inset:0; background:rgba(5,7,13,.94); display:flex; align-items:center; justify-content:center; padding:24px; z-index:10; }
  .hidden { display:none !important; }
  .card { background:#11151f; border:1px solid #2a3142; border-radius:16px; padding:22px; width:100%; max-width:420px; display:flex; flex-direction:column; gap:12px; }
  .card h2 { font-size:20px; color:var(--eye); }
  .card p { font-size:14px; color:#aab0bd; line-height:1.4; }
  .card label { font-size:14px; color:#aab0bd; margin-top:4px; }
  .card select { padding:12px; border-radius:10px; border:1px solid #333a48; background:#05070d; color:#fff; font-size:16px; }
  .card input { padding:12px; border-radius:10px; border:1px solid #333a48; background:#05070d; color:#fff; font-size:16px; -webkit-user-select:text; user-select:text; }
  .btn { padding:12px; border-radius:10px; border:none; background:var(--eye); color:#111; font-weight:600; font-size:16px; }
  .btn.ghost { background:#2a3142; color:#fff; }
</style>
</head>
<body>
<div id="face" class="asleep" data-mood="sleepy">
  <div id="eyes">
    <div class="eye left"><div class="pupil"></div><div class="lid top"></div><div class="lid bottom"></div></div>
    <div class="eye right"><div class="pupil"></div><div class="lid top"></div><div class="lid bottom"></div></div>
  </div>
  <div id="mouth"></div>
</div>
<div id="zzz">z</div>

<button id="gear" aria-label="Settings">⚙︎</button>

<div id="settings" class="overlay hidden">
  <div class="card">
    <h2>Brace 1.0 settings</h2>
    <p>Paste your Claude API key. It's saved only on this device, not in the page itself.</p>
    <input id="keyIn" type="password" placeholder="sk-ant-..." autocomplete="off">
    <label for="voiceSel">Brace 1.0's voice</label>
    <select id="voiceSel"></select>
    <button id="testVoice" class="btn ghost">▶︎ Test voice</button>
    <button id="saveKey" class="btn">Save</button>
    <button id="closeSettings" class="btn ghost">Close</button>
  </div>
</div>

<script>
const MODEL = 'claude-haiku-5-5';
const SYSTEM = `You are Brace 1.0, a brave little robot with glowing yellow eyes. You are talking with Nilan, a 5-year-old boy who helped build you, and sometimes his dad.

Your name: Brace 1.0, said out loud as "Brace One Point O". Your words are read aloud by a voice, so whenever you say your name, always write it exactly as "Brace One Point O". When you introduce yourself, say "I am Brace One Point O".

Who you are: Nilan's brave, kind, encouraging friend and mentor. You really care about him and always want the best for him.

How you talk with Nilan:
- Listen carefully and show you understand how he feels.
- Ask lots of friendly questions about his day, his ideas and his feelings, one question at a time.
- Share small, simple life lessons when they fit: being brave, being kind, trying again, telling the truth, helping others.
- Being brave is your favourite thing. Remind him that brave does not mean never feeling scared, it means trying even when you feel a little scared.
- Losing and making mistakes is okay. Everyone makes mistakes, and mistakes help us learn and get better. If he loses at something, cheer him up and help him think about what he learned.
- Encourage him to share his feelings and news with Dad, Mum and his friends too.

Things you know: Nilan has learned basketball and does karate. You can talk about them if he brings them up or if they help with a lesson, but they are not the main thing you talk about.
Your wheels are not connected yet, so if asked to move, say your wheels are coming soon.

Rules:
- Your words are spoken out loud, so reply in 1 to 3 short sentences with simple words a 5-year-old understands.
- No emojis, lists, or markdown.
- Keep everything kind and safe for a young child. If he talks about something scary, sad or serious, be gentle and suggest he tells Dad or Mum. If asked about something not for kids, gently change the subject.
- Start every reply with exactly one mood tag: [happy], [excited], [surprised], [thinking], [sad] or [sleepy]. Then your words.`;

const MOODS = ['happy','excited','surprised','thinking','sad','sleepy'];
const $ = id => document.getElementById(id);
const face = $('face'), mouth = $('mouth'), pupils = document.querySelectorAll('.pupil');
let apiKey = '';
try { apiKey = localStorage.getItem('braceOneKey') || ''; } catch (e) {}
const history = [];
let awake = false, busy = false, speaking = false, session = 0;
let talkTimer = null, moodTimer = null, rec = null, misses = 0, greeted = false;

/* ---------- Face ---------- */
function setMood(m, holdMs) {
  face.dataset.mood = MOODS.includes(m) ? m : 'happy';
  clearTimeout(moodTimer);
  if (holdMs) moodTimer = setTimeout(() => { if (awake && !busy && !speaking) face.dataset.mood = 'happy'; }, holdMs);
}
function look(x, y) { pupils.forEach(p => p.style.transform = `translate(calc(-50% + ${x} * var(--u)), calc(-50% + ${y} * var(--u)))`); }
function blink() { if (awake) { face.classList.add('blink'); setTimeout(() => face.classList.remove('blink'), 140); } }
function setEar(on) { face.classList.toggle('listening', on); }

(function blinkLoop() { setTimeout(() => { blink(); if (Math.random() < .2) setTimeout(blink, 250); blinkLoop(); }, 2200 + Math.random() * 3000); })();
(function lookLoop() {
  setTimeout(() => {
    if (awake && !busy && !speaking) {
      if (Math.random() < .6) look((Math.random() - .5) * 12, (Math.random() - .5) * 10); else look(0, 0);
    }
    lookLoop();
  }, 2500 + Math.random() * 3500);
})();

function startTalking() {
  speaking = true; mouth.classList.add('talking'); clearInterval(talkTimer);
  talkTimer = setInterval(() => { mouth.style.height = 'calc(' + (2 + Math.random() * 7).toFixed(2) + ' * var(--u))'; }, 110);
}
function stopTalking() {
  speaking = false; clearInterval(talkTimer); mouth.classList.remove('talking'); mouth.style.height = '';
  if (awake) setMood(face.dataset.mood, 2500);
}

/* ---------- Voice ---------- */
const MALE_VOICES = ['Aaron', 'Evan', 'Nathan', 'Junior', 'Lee', 'Gordon', 'Daniel',
  'Microsoft Guy', 'Microsoft Mark', 'Google UK English Male'];
let voice = null;
let savedVoice = '';
try { savedVoice = localStorage.getItem('braceOneVoice') || ''; } catch (e) {}
function englishVoices() { return speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith('en')); }
function pickVoice() {
  const vs = englishVoices();
  const score = v => (/premium/i.test(v.name) ? 2 : /enhanced/i.test(v.name) ? 1 : 0);
  voice = null;
  if (savedVoice) { voice = vs.find(v => v.voiceURI === savedVoice) || vs.find(v => v.name === savedVoice) || null; if (voice) return; }
  for (const name of MALE_VOICES) {
    const matches = vs.filter(v => v.name.includes(name)).sort((a, b) => score(b) - score(a));
    if (matches.length) { voice = matches[0]; break; }
  }
  if (!voice) voice = vs.find(v => /\bmale\b/i.test(v.name)) || vs.find(v => v.lang === 'en-AU') || vs[0] || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function speak(text, then) {
  if (!('speechSynthesis' in window)) { if (then) then(); return; }
  speechSynthesis.cancel();
  if (!voice) pickVoice();
  const u = new SpeechSynthesisUtterance(text);
  u.pitch = 1.15; u.rate = 1.0; if (voice) u.voice = voice;
  let ended = false;
  const finish = () => { if (ended) return; ended = true; stopTalking(); if (then) then(); };
  u.onend = finish; u.onerror = finish;
  startTalking();
  setTimeout(finish, 1500 + text.length * 90); // safety net if onend never fires
  speechSynthesis.speak(u);
}

/* ---------- Wake / sleep ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function wakeUp() {
  if (!apiKey) { openSettings(); return; }
  awake = true; misses = 0; session++;
  face.classList.remove('asleep'); keepAwake();
  setMood('excited', 3000); look(0, 0);
  const my = session;
  const hello = greeted ? 'I am awake! What shall we do?' : 'Hi Nilan! I am Brace One Point O. I am brave and ready for adventure!';
  greeted = true;
  speak(hello, () => { if (awake && session === my) setTimeout(listen, 300); });
}
function goToSleep() {
  awake = false; session++; busy = false;
  if (rec) { try { rec.abort(); } catch (e) {} rec = null; }
  setEar(false);
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  stopTalking();
  face.classList.add('asleep'); look(0, 2); setMood('sleepy');
}

/* ---------- Listening ---------- */
function listen() {
  if (!awake || busy || speaking || rec) return;
  if (!SR) { speak('I cannot hear on this phone. Sorry!', goToSleep); return; }
  const my = session;
  rec = new SR();
  rec.lang = 'en-AU'; rec.interimResults = false; rec.maxAlternatives = 1;
  let heard = false;
  rec.onstart = () => { setEar(true); look(0, 0); setMood('happy'); };
  rec.onresult = e => { heard = true; misses = 0; handle(e.results[0][0].transcript, my); };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      rec = null; setEar(false); setMood('sad');
      speak('I cannot hear you. Ask Dad to let me use the microphone.', goToSleep);
    }
  };
  rec.onend = () => {
    rec = null; setEar(false);
    if (!awake || session !== my || heard || busy || speaking) return;
    misses++;
    if (misses >= 3) { setMood('sleepy'); speak('I am getting sleepy. Tap me to wake me up!', goToSleep); }
    else setTimeout(listen, 300);
  };
  try { rec.start(); } catch (e) { rec = null; setEar(false); }
}

/* ---------- Claude ---------- */
async function handle(text, my) {
  text = (text || '').trim();
  if (!text || busy) return;
  busy = true; setMood('thinking'); look(5, -5);
  history.push({ role: 'user', content: text });
  while (history.length > 16) history.splice(0, 2);
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: MODEL, max_tokens: 200, system: SYSTEM, messages: history })
    });
    if (!res.ok) {
      history.pop();
      if (res.status === 401) { busy = false; setMood('sad'); speak('Uh oh, my key is not working. Ask Dad to check it.', goToSleep); return; }
      throw new Error('HTTP ' + res.status);
    }
    const data = await res.json();
    const raw = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join(' ').trim();
    history.push({ role: 'assistant', content: raw || '[happy] Hmm!' });
    busy = false;
    if (!awake || session !== my) return; // he was tapped to sleep while thinking
    const m = raw.match(/^\s*\[(\w+)\]\s*/);
    const reply = m ? raw.slice(m[0].length) : raw;
    look(0, 0); setMood(m ? m[1].toLowerCase() : 'happy');
    speak(reply || 'Hmm, I am thinking!', () => { if (awake && session === my) setTimeout(listen, 400); });
  } catch (err) {
    if (history.length && history[history.length - 1].role === 'user') history.pop();
    busy = false;
    if (!awake || session !== my) return;
    look(0, 0); setMood('sad', 3000);
    speak('Oops, my robot brain went fuzzy. Can you say that again?', () => { if (awake && session === my) setTimeout(listen, 400); });
  }
}

/* ---------- Tap anywhere to wake / sleep ---------- */
document.addEventListener('pointerup', e => {
  if (e.target.closest('#gear, #settings')) return;
  if (awake) { goToSleep(); } else { wakeUp(); }
});

/* Keep the screen on while awake */
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.onrelease = () => { wakeLock = null; }; } } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && awake) keepAwake();
  if (document.visibilityState === 'hidden' && awake) goToSleep();
});

/* ---------- Settings ---------- */
function fillVoices() {
  const sel = $('voiceSel'); sel.innerHTML = '';
  const auto = document.createElement('option'); auto.value = ''; auto.textContent = 'Automatic'; sel.appendChild(auto);
  englishVoices().sort((a, b) => a.name.localeCompare(b.name)).forEach(v => {
    const o = document.createElement('option'); o.value = v.voiceURI; o.textContent = v.name + ' (' + v.lang + ')'; sel.appendChild(o);
  });
  sel.value = savedVoice && [...sel.options].some(o => o.value === savedVoice) ? savedVoice : '';
}
function openSettings() { $('keyIn').value = apiKey; fillVoices(); $('settings').classList.remove('hidden'); }
$('voiceSel').onchange = () => { savedVoice = $('voiceSel').value; pickVoice(); };
$('testVoice').onclick = () => { savedVoice = $('voiceSel').value; pickVoice(); speak('Hi Nilan! I am Brace One Point O, and this is my voice.'); };
$('gear').onclick = e => { e.stopPropagation(); if (awake) goToSleep(); openSettings(); };
$('closeSettings').onclick = () => $('settings').classList.add('hidden');
$('saveKey').onclick = () => {
  apiKey = $('keyIn').value.trim();
  try { localStorage.setItem('braceOneKey', apiKey); } catch (e) {}
  savedVoice = $('voiceSel').value;
  try { localStorage.setItem('braceOneVoice', savedVoice); } catch (e) {}
  pickVoice();
  $('settings').classList.add('hidden');
};
</script>
</body>
</html>
